
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REALLY Magazine</title>
   
<style>
/* =================================
   1. BASIC SETTINGS
================================= */

@import url('https://fonts.googleapis.com/css2?family=STIX+Two+Text:wght@700&display=swap');
   
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #FFFFFF;
    color: #080808;
    font-family: Arial, sans-serif;
}

:root {
    --red: #C00000;
    --black: #080808;
    --white: #FFFFFF;
}

/* =================================
   2. MAIN LAYOUT
================================= */

#app {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* =================================
   3. HOME SCREEN
================================= */

.screen {
    display: none;
    width: 100%;
    height: calc(100% - 64px);
    flex: 1;
    min-height: 0;
}

.screen.active {
    display: block;
}

/* MAIN PHOTO */

#home {
    position: relative;
    background-image: url("./main-cover.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
}

/* TOP REALLY LOGO */

.top-logo {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    padding: 12px 20px;
    color: var(--red);
    font-family: 'STIX Two Text', serif;
    font-weight: 900;
    font-size: clamp(24px, 5vw, 65px);
    line-height: 1;
    z-index: 2;
}

.top-logo span:nth-child(1) {
    text-align: left;
}

.top-logo span:nth-child(2),
.top-logo span:nth-child(3),
.top-logo span:nth-child(4),
.top-logo span:nth-child(5) {
    text-align: center;
}

.top-logo span:nth-child(6) {
    text-align: right;
}

/* BRAND AREA */

.brand-area {
  position: absolute;
  left: 40px;
  bottom: 40px;

  display: inline-flex;
  flex-direction: column;
  align-items: flex-start;
  width: fit-content;

  background-color: #C00000;
  color: #FFFFFF;
  padding: 12px 16px;
}

.brand-title {
  font-family: Impact, "Arial Narrow", sans-serif;
  font-weight: 700;
  font-size: 32px;
  color: #FFFFFF;
  background: none;
  padding: 0;
  line-height: 1.2;
}
.brand-keyword {
    font-family: Impact, "Arial Narrow", sans-serif;
    font-size: clamp(11px, 1.25vw, 17px);
    font-weight: normal;
    letter-spacing: 0.04em;
    line-height: 1.15;
    text-transform: uppercase;
    color: #FFFFFF;
}

/* =================================
   4. BOTTOM DESKTOP BAR
================================= */

.bottom-bar {
    width: 100%;
    height: 64px;
    min-height: 64px;
    background: var(--white);
    border-top: 1px solid #DDDDDD;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    align-items: center;
    z-index: 10;
}

.nav-button {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    color: var(--black);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
}

.nav-button:hover {
    background: var(--black);
    color: var(--white);
}

/* =================================
   5. SUB PAGES
================================= */

.sub-page {
    width: 100%;
    height: 100%;
    background: var(--white);
    position: relative;
    padding: 5vw;
    overflow: hidden;
}

.sub-page h1 {
    color: var(--red);
    font-family: "Times New Roman", Times, serif;
    font-size: clamp(45px, 8vw, 110px);
    font-weight: normal;
    margin-bottom: 25px;
}

.sub-page p {
    font-size: 14px;
    line-height: 1.8;
}

.back-home {
    position: absolute;
    right: 5vw;
    top: 5vw;
    border: 1px solid var(--black);
    padding: 10px 18px;
    background: var(--white);
    color: var(--black);
    cursor: pointer;
    font-size: 11px;
}

.back-home:hover {
    background: var(--black);
    color: var(--white);
}

/* =================================
   6. MOBILE
================================= */

@media (max-width: 600px) {

    .top-logo {
        padding: 12px 10px;
        font-size: clamp(22px, 7vw, 38px);
    }

    .brand-area {
        left: 5%;
        bottom: 5%;
    }

    .brand-title {
        font-size: clamp(27px, 8vw, 42px);
    }

    .brand-keyword {
        font-size: 10px;
    }

    .bottom-bar {
        height: 58px;
        min-height: 58px;
    }

    .nav-button {
        font-size: 9px;
        letter-spacing: 0;
    }
}

</style>
</head>

<body>

<div id="app">

    <!-- =================================
         HOME
    ================================== -->

    <main id="home" class="screen active">

        <!-- TOP LOGO -->

        <div class="top-logo" aria-label="REALLY">
            <span>R</span>
            <span>E</span>
            <span>A</span>
            <span>L</span>
            <span>L</span>
            <span>Y</span>
        </div>

        <!-- BRAND AREA -->

        <div class="brand-area">

            <h1 class="brand-title">
                REALLY Magazine
            </h1>

            <p class="brand-keyword">
                LULULULULULUL / VERY FAMILIAR, VERY STRANGE.
            </p>

        </div>

    </main>


    <!-- =================================
         ABOUT
    ================================== -->

    <section id="about" class="screen">
        <div class="sub-page">

            <button class="back-home" onclick="goHome()">
                ← HOME
            </button>

            <h1>ABOUT</h1>

            <p>
                REALLY Magazine
            </p>

        </div>
    </section>


    <!-- =================================
         CONTENTS
    ================================== -->

    <section id="contents" class="screen">
        <div class="sub-page">

            <button class="back-home" onclick="goHome()">
                ← HOME
            </button>

            <h1>CONTENTS</h1>

            <p>
                Explore our stories and works.
            </p>

        </div>
    </section>


    <!-- =================================
         ARCHIVE
    ================================== -->

    <section id="archive" class="screen">
        <div class="sub-page">

            <button class="back-home" onclick="goHome()">
                ← HOME
            </button>

            <h1>ARCHIVE</h1>

            <p>
                Previous issues and records.
            </p>

        </div>
    </section>


    <!-- =================================
         CONTACT
    ================================== -->

    <section id="contact" class="screen">
        <div class="sub-page">

            <button class="back-home" onclick="goHome()">
                ← HOME
            </button>

            <h1>CONTACT</h1>

            <p>
                Contact REALLY Magazine.
            </p>

        </div>
    </section>


    <!-- =================================
         BOTTOM NAVIGATION
    ================================== -->

    <nav class="bottom-bar">

        <button class="nav-button"
                onclick="showPage('about')">
            ABOUT
        </button>

        <button class="nav-button"
                onclick="showPage('contents')">
            CONTENTS
        </button>

        <button class="nav-button"
                onclick="showPage('archive')">
            ARCHIVE
        </button>

        <button class="nav-button"
                onclick="window.open('https://www.naver.com', '_blank', 'noopener,noreferrer')">
            BUY ISSUE ↗
        </button>

        <button class="nav-button"
                onclick="showPage('contact')">
            CONTACT
        </button>

    </nav>

</div>


<script>

/* =================================
   PAGE TRANSITION
================================= */

function showPage(pageId) {

    document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
    });

    document.getElementById(pageId).classList.add('active');

}

function goHome() {

    document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
    });

    document.getElementById('home').classList.add('active');

}

</script>

</body>
</html>


</body>
</html>
